version: 1
updated_at: 2026-04-19

framework:
  phase_30_days:
    focus: foundations and role baseline
  phase_60_days:
    focus: guided execution and cross-team collaboration
  phase_90_days:
    focus: independent delivery and measurable impact

paths:
  software_engineer:
    day_0_30:
      - Complete language and framework fundamentals in stack.
      - Build one API and one UI feature with tests.
      - Follow team branching and code review standards.
    day_31_60:
      - Own one medium feature end-to-end.
      - Add CI pipeline checks and basic observability.
      - Resolve 3 production defects with root cause analysis.
    day_61_90:
      - Lead technical design for one sprint item.
      - Improve performance, security, or reliability metric.
      - Mentor one junior peer on coding standards.

  product_owner_product_manager:
    day_0_30:
      - Understand product vision, users, and current roadmap.
      - Audit backlog quality and define prioritization criteria.
      - Publish one-page KPI baseline.
    day_31_60:
      - Run discovery for one top problem area.
      - Refine stories with acceptance criteria and outcomes.
      - Align engineering, design, and business stakeholders.
    day_61_90:
      - Launch one increment with measurable business value.
      - Present roadmap update with tradeoff decisions.
      - Improve one KPI and explain causality.

  business_enablement:
    day_0_30:
      - Map key business processes and pain points.
      - Identify compliance and governance dependencies.
      - Build stakeholder map and communication plan.
    day_31_60:
      - Facilitate process redesign workshop.
      - Publish operating model recommendations.
      - Define value realization checkpoints.
    day_61_90:
      - Implement one prioritized process improvement.
      - Measure throughput, quality, or cycle-time improvement.
      - Standardize documentation and handoff templates.

  quality_assurance:
    day_0_30:
      - Review test strategy and existing regression suite.
      - Build smoke and API test coverage for critical paths.
      - Align defect triage with engineering team.
    day_31_60:
      - Automate top regression scenarios.
      - Introduce risk-based test planning.
      - Add quality gates to CI pipeline.
    day_61_90:
      - Reduce escaped defects through root cause actions.
      - Track and improve release readiness metrics.
      - Establish test data and environment standards.

  ui_ux_designer:
    day_0_30:
      - Audit current user journeys and design debt.
      - Define core personas and usability hypotheses.
      - Align with PM and engineering on design constraints.
    day_31_60:
      - Deliver validated prototypes for one key flow.
      - Improve accessibility compliance on key screens.
      - Create reusable components in design system.
    day_61_90:
      - Measure UX changes against product metrics.
      - Reduce handoff friction with clear specs and tokens.
      - Run a structured usability test and action plan.

  it_infrastructure:
    day_0_30:
      - Baseline current infrastructure inventory and risks.
      - Validate backup, restore, and patch status.
      - Confirm monitoring coverage for critical services.
    day_31_60:
      - Automate one repetitive operational workflow.
      - Improve alert quality and incident response playbooks.
      - Address top availability bottlenecks.
    day_61_90:
      - Deliver one resiliency improvement initiative.
      - Test disaster recovery scenario and report results.
      - Define capacity plan for next quarter.

  network_and_security:
    day_0_30:
      - Review network segmentation and access posture.
      - Baseline vulnerability and patch metrics.
      - Validate incident response escalation workflow.
    day_31_60:
      - Harden firewall and IAM policies for critical assets.
      - Integrate logs into SIEM and tune key detections.
      - Run tabletop incident drill.
    day_61_90:
      - Reduce mean time to detect and respond.
      - Close high-risk vulnerabilities with documented evidence.
      - Publish security control maturity improvement plan.

  database_administrator:
    day_0_30:
      - Audit backup, restore, and access controls.
      - Baseline performance and capacity metrics.
      - Confirm patch and version posture.
    day_31_60:
      - Optimize top slow queries and indexes.
      - Strengthen replication and high-availability checks.
      - Improve monitoring thresholds and runbooks.
    day_61_90:
      - Execute restore drill with recovery objectives.
      - Reduce incidents caused by configuration drift.
      - Create quarterly upgrade and capacity roadmap.

  database_engineer:
    day_0_30:
      - Review schemas and data quality pain points.
      - Baseline query performance and pipeline reliability.
      - Document current migration workflow.
    day_31_60:
      - Refactor one schema or ETL flow for performance.
      - Add data validation checks in pipelines.
      - Improve migration rollback strategy.
    day_61_90:
      - Deliver one cross-system data integration safely.
      - Improve latency and cost metrics.
      - Publish data model and ownership standards.

  ai_engineer:
    day_0_30:
      - Define AI use case scope, constraints, and success metrics.
      - Build baseline prototype and evaluation criteria.
      - Set data governance and safety requirements.
    day_31_60:
      - Implement retrieval and prompt optimization cycle.
      - Establish offline and online quality evaluations.
      - Add observability for latency, cost, and output quality.
    day_61_90:
      - Ship one production-grade AI feature.
      - Improve model quality using feedback loop.
      - Create AI risk register and mitigation controls.
